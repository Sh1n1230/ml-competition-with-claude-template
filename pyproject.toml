[project]
name = "ml-competition-with-claude-template"
version = "0.1.0"
description = "Template for ML competitions (Kaggle / SIGNATE / atmaCup / Nishika / ProbSpace) with Claude Code and open-source tooling."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
keywords = ["machine-learning", "kaggle", "signate", "competitions", "reproducibility"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    # modeling
    "catboost>=1.2",
    "lightgbm>=4.0",
    "xgboost>=2.0",
    "scikit-learn>=1.3",
    "optuna>=3.4",
    "joblib>=1.3",
    # data
    "pandas>=2.0",
    "polars>=0.20",
    "pyarrow>=14.0",
    # viz / notebook
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "ipykernel>=6.29",
    "nbformat>=5.9",
    "papermill>=2.6",
    # misc
    "python-dotenv>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/commons"]

[dependency-groups]
dev = [
    "mypy>=1.8",
    "ruff>=0.6",
    "pytest>=8.3",
]
# Neural-net / PyTorch support. Opt in: `uv sync --group nn`.
nn = [
    "torch>=2.4",
    "pytabkit>=1.7",
]
# 日本語コンペ向け: SIGNATE CLI + 日本語フォント. Opt in: `uv sync --group jp`.
jp = [
    "signate>=0.12",
    "japanize-matplotlib>=1.1",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
no_implicit_optional = true
mypy_path = "src:scripts"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "scripts"]
